     NSBH CMS Map — BLOCK 1
     Paste into: Page Settings → Beef Shops → Custom Code → Inside <head> tag
     (Must be in <head>, never a body Embed — load-order matters.)
     ============================================================================ -->

<!-- ============================================================================
     ATTRIBUTE PLACEMENT MAP — what goes on which element in Designer.
     Everything is found by attribute, so no class name is load-bearing.
     Full option list: github.com/JohnKuehnDesign/nsbh-webflow

     MAP DIV .............................. data-map-element="viewport"     REQUIRED
       ALL data-map-* SETTINGS GO HERE — never on a Collection Item.
         data-map-cooperative-gestures="true"  two-finger / ctrl to zoom (mobile)
         data-map-center="-70.95,42.55"     lng,lat
         data-map-zoom="9"
         data-map-focus-offset="70"         optional override. By default the
                                            card is centred in the map and the
                                            offset is measured from its height.
         data-map-premium="all"             premium seal: all (every shop, the
                                            default), cms (only shops marked
                                            Premium), none
         data-map-popup-actions="false"     keep false: links live in the card

     HIDDEN DATA — Collection Items, outside the visible page (Map data block)
       data-map-element="item"             REQUIRED on every item
       data-map-kind="shop|destination"    destinations get the Harbor Blue dot
       data-id (slug), data-lat, data-lng  REQUIRED
       data-name, data-display-name, data-address, data-description, data-phone,
       data-website, data-order, data-google-map-link, data-directions-link,
       data-region / data-region-name, data-town / data-town-name
         Reference fields bind through their sub-fields (Region > Name).
       Premium: a child element data-map-field="premium" whose visibility is
         bound to the Premium switch (a switch cannot bind to an attribute).
       Destination image: a child <img data-map-field="image"> bound to Featured
         Image. Webflow marks an empty one with w-dyn-bind-empty.

     CARD TEMPLATES — static, outside every Collection List, visible in Designer
       data-map-element="card-templates"   the section; hidden on the live page by
                                           the rule below
       data-map-template="shop|destination"  one block per card type
       data-map-card                       the element that gets cloned
       data-map-slot="name|region|town|separator|description|address|premium|
                      tags|tag|tag-icon|directions|call|website|image|link|
                      distance|distance-text|nearby|nearby-item"  fields the script fills; an empty value
                                           removes the slot

     SEARCH UI (all optional; omit the whole search and it's skipped)
       Text input ......................... data-map-element="search-input"
       Miles <select> ..................... data-map-element="search-radius"
       Search button ...................... data-map-element="search-submit"
       Clear button ....................... data-map-element="search-clear"
       Result text block .................. data-map-element="search-status"
       Settings toggle (tablet and below) . data-map-element="quick-picks-open"

     SEARCH SUGGESTIONS (optional; without them search is address-only)
       Wrapper under the input ............ data-map-element="suggest" + hidden
       Listbox inside it .................. data-map-element="suggest-list"
       Sample rows (card templates area) .. data-map-template="suggestion", with
                                            rows data-map-suggest="place|shop" and
                                            slots data-map-slot="name|label|address"
       The input needs role="combobox", aria-autocomplete="list", aria-controls
       (the listbox id) and aria-expanded="false". Details in the README.

     SETTINGS PANEL (all optional)
       Regions: data-map-element="region" buttons with data-slug, "region-clear"
       Tags: data-map-element="tag" buttons with data-slug, "tag-clear"
       Things to do switch: data-map-element="destinations-toggle" (role="switch")
       Radius select: "search-radius"; "radius-reset"
       My location: "locate" (a <button>), "locate-input", "locate-clear", "locate-status";
       pin template data-map-template="location"; card flag slots "distance"
       (the flag) and "distance-text" (its words, optional)
       Give each control an aria-label where its visible text is not enough.

     LAYOUT GOTCHA
       The map's flex-item ancestor (.map_panel here) needs min-width: 0 or the
       canvas props the page wider than a phone screen. Rule is below.
     ============================================================================ -->

<!-- 1. MapLibre's own stylesheet. Must load before ours. -->
<link rel="stylesheet" href="https://esm.sh/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

<!-- 2. The map component's stylesheet, from GitHub via jsDelivr.
        Pinned to a release tag — bump the version to pick up changes. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/JohnKuehnDesign/nsbh-webflow@1.8.1/src/map/map-embed.css" />

<!-- 3. Site-side styles. Yours to change without cutting a release. -->
<style>
  /* The static card templates stay visible in Designer; hide them on the live page. */
  [data-map-element="card-templates"] { display: none; }

  /* Map container — replace with Designer sizing on the map div's class. */
  [data-map-element="viewport"] {
    min-height: 420px;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
  }

  /* Mobile horizontal-scroll fix.
     .map_panel is a flex child, and a flex item's default min-width:auto refuses
     to shrink below its content — the map canvas's pixel width then props the
     whole page wider than the phone screen. min-width:0 lets it shrink to fit.
     If you rename .map_panel in Designer, update this selector to match. */
  .map_panel {
    min-width: 0;
  }

  @media (max-width: 640px) {
    [data-map-element="viewport"] { min-height: 320px; }
  }

  /* ---- Popup-only content ----
     Do NOT set Display: None on .map-item_show-modal in Designer. Style it there
     however you like (flex, gap, padding) and hide it only in the LIST with the
     rule below. The popup clone is the only copy carrying .cms-map-popup-card,
     so :not() leaves the popup completely untouched — no override to undo. */
  [data-map-element="item"]:not(.cms-map-popup-card) .map-item_show-modal {
    display: none;
  }

  /* Active list item — JS toggles .is-active on both marker and list item. */
  [data-map-element="item"].is-active {
    outline: 2px solid currentColor;
    outline-offset: -2px;
    border-radius: 8px;
  }

  /* Search status line. */
  [data-map-element="search-status"] {
    font-size: 0.875rem;
    line-height: 1.4;
    min-height: 1.4em;
    opacity: 0.8;
  }

  /* Inner padding for the popup card.
     The popup shell is chrome-less now, so .map-item_wrapper is the only visible
     edge — its contents need room inside it. Scoped to the clone, so list rows
     keep their tighter spacing. Adjust to taste. */
  .cms-map-popup-card .map-item_wrapper {
    padding: 1.25rem 1.25rem .5rem 1.25rem;
  }
</style>
