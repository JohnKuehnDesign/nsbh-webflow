     NSBH Analytics — SITE-WIDE, two blocks
     Not Webflow's native Google Analytics field (Apps & Integrations): that one
     can't be switched off when the visitor declines.
     ============================================================================ -->

<!-- ============================================================================
     BLOCK A — Paste into: Site settings → Custom code → Head code
     Replaces the Finsweet cookie consent script and the old fs-cc gtag block:
     delete those, then paste this at the top.

     consent.js decides whether analytics is on (opt-out: on unless the visitor
     declines or their browser sends Global Privacy Control) and runs the
     nsbhConsent.on() callback now and on every change. On: gtag loads. Off:
     gtag never loads, or if it already has on this page, ga-disable stops it
     sending and the _ga cookies are removed. PostHog (third script) follows the
     same callback: it loads only while analytics is on.

     consent.js must stay a plain script (no async/defer) above the callback.

     On the staging domain (*.webflow.io) every hit carries debug_mode, so it
     shows in GA4 DebugView and the "Developer traffic" data filter keeps it out
     of the reports. Omitted entirely on the live domain: GA treats
     debug_mode: false as on.
     ============================================================================ -->
<script src="https://cdn.jsdelivr.net/gh/JohnKuehnDesign/nsbh-webflow@1.15.0/src/consent/consent.js"></script>
<script>
  nsbhConsent.on(function (granted) {
    var id = 'G-XK1038NE6D';
    window['ga-disable-' + id] = !granted;
    if (!granted) return nsbhConsent.clearCookies(/^_ga/);
    if (window.gtag) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    window.gtag('js', new Date());
    window.gtag('config', id,
      location.hostname.endsWith('.webflow.io') ? { debug_mode: true } : {});
  });
</script>
<script>
  /* PostHog: the same rules as GA. It loads only while analytics is on, so a
     visitor who declines or sends GPC never loads it. Declining mid-page opts it
     out (stops events and session replay) and removes its ph_ cookies and storage.
     Replaces the plain PostHog snippet: delete that one from Head code. */
  nsbhConsent.on(function (granted) {
    var ph = window.posthog;
    if (!granted) {
      if (ph && ph.opt_out_capturing) ph.opt_out_capturing();
      // Stop it writing its ph_ cookie and storage back after they're cleared.
      if (ph && ph.__loaded) ph.set_config({ disable_persistence: true });
      nsbhConsent.clearCookies(/^ph_/);
      [window.localStorage, window.sessionStorage].forEach(function (store) {
        try {
          Object.keys(store).forEach(function (k) { if (/^ph_/.test(k)) store.removeItem(k); });
        } catch (e) { /* storage blocked: nothing stored */ }
      });
      return;
    }
    if (ph && ph.opt_in_capturing) {
      if (ph.__loaded) ph.set_config({ disable_persistence: false });
      return ph.opt_in_capturing();
    }
